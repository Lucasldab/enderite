# ============================================================
# Fabric Mod Version Pins
# Update these when targeting a new MC release.
#
# minecraft_version  — Minecraft Java Edition release
# loader_version     — Fabric Loader (fabric-loader on Maven)
# loom_version       — Fabric Loom Gradle plugin
# fabric_api_version — Fabric API (suffix must match MC version)
#
# Current target: Minecraft 26.1.2 (April 2026)
# Yarn mappings are not used; 26.1 ships unobfuscated.
# Reference: https://fabricmc.net/develop/
# ============================================================
minecraft_version=26.1.2
loader_version=0.19.2
loom_version=1.16-SNAPSHOT
fabric_api_version=0.146.1+26.1.2

# Mod metadata
mod_version=1.0.0
maven_group=com.lucasldab
archives_base_name=enderite

# Gradle performance
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# Disabled for IntelliJ IDEA compatibility
org.gradle.configuration-cache=false
